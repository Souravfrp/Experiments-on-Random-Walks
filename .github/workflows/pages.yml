name: Publish searchable experiment archive

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/build_public_index.py"
      - "results/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate curated experiment index from checked-in CSVs
        run: python tools/build_public_index.py
      - name: Verify index structure
        run: |
          python tools/build_public_index.py --check
          python -m json.tool site/data/experiments.json > /dev/null
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static research archive
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy archive
        id: deployment
        uses: actions/deploy-pages@v4
